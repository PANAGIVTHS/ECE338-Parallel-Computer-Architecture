# The user manual, built by Zensical: `gpgpu docs site:build` and `site:serve`.
# See docs/manual/contributing/documentation.md.
# No site_url or repo_url: the manual is not published yet.
site_name: ECE338 GPGPU
site_description: User manual of the ECE338 GPGPU
docs_dir: docs/manual
site_dir: site

nav:
  - Home: index.md
  - Contributing:
      - Writing documentation: contributing/documentation.md

theme:
  name: material
  language: en
  icon:
    logo: material/chip
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
