<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPGPU Architecture Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%235b8def%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="map.css">
</head>
<body>
<header class="bar">
  <div class="brand"><span class="mark"></span>GPGPU architecture</div>
  <nav class="crumbs" id="crumbs" aria-label="Position"></nav>
  <div class="search">
    <input id="search" type="search" placeholder="Find a block" autocomplete="off" spellcheck="false" aria-label="Find a block">
    <kbd>/</kbd>
    <ul id="results" role="listbox" hidden></ul>
  </div>
</header>
<main id="stage">
  <svg id="map" role="img" aria-label="Zoomable architecture diagram"></svg>
  <div id="status" class="status">Laying out the model…</div>
  <aside class="legend" id="legend" data-collapsed>
    <button class="legend-toggle" id="legend-toggle" aria-expanded="false">Legend</button>
    <div class="legend-body" id="legend-body"></div>
  </aside>
  <div class="hint" id="hint">Scroll to zoom into a block · drag to pan · click to inspect · <kbd>Esc</kbd> zooms out · <kbd>F</kbd> fits all</div>
</main>
<aside class="panel" id="panel" hidden>
  <button class="close" id="panel-close" aria-label="Close">×</button>
  <div id="panel-body"></div>
</aside>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/elkjs@0.9.3/lib/elk.bundled.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<script src="map.js"></script>
</body>
</html>
