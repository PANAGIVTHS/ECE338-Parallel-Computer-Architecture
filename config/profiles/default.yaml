architecture:
  num_cores: 24

hardware:
  fpga:
    part: xc7z020clg484-1
    agent:
      device: "210299730789"
      directory: /app
    uart:
      port: /dev/ttyUSB0
      baud: 115200
      sudo: true
      python: python3
    upload:
      destination: njason@192.168.1.13
      directory: /home/njason/upload
  serial:
    port: /dev/ttyACM0
    baud: 115200
  vivado:
    ip_project_name: gpgpu_ip_dev
    project_name: gpgpu_system
    bd_name: design_1
    top: design_1_wrapper
    xsa_name: gpgpu_platform
    version: "2025.2"
    jobs: 6
    peripheral:
      base_address: "0x43C00000"
      range: "0x00010000"
  vitis:
    version: "2025.2"
    platform_name: gpgpu_platform
    host_name: gpgpu_host
    cpu: ps7_cortexa9_0
    domain: standalone_ps7_cortexa9_0
    os: standalone
    template: empty_application
    default_archive: tools/hardware/vitis/default-project.zip
    host_sources:
      - software/host/xc7z020/gpgpu_driver.c
      - software/host/xc7z020/main.c

software:
  riscv:
    march: rv32im
    abi: ilp32

tests:
  rtl:
    smx:
      # Compile with --trace and run with +DUMP; VCD stays in build/tests/rtl/smx.
      trace: false
    random:
      iterations: 100
      # Set a non-zero integer for reproducibility; 0 chooses and prints a seed.
      seed: 0

paths:
  build:
    root: build

# Commands are names or paths. Machine-specific paths belong in config/local.yaml.
tools:
  git:
    command: git
    required: true
  python:
    command: python3
    required: true
  make:
    command: make
    required: true
  native_cc:
    command: gcc
    required: true
  riscv_gcc:
    command: riscv64-unknown-elf-gcc
    required: true
  verilator:
    command: verilator
    required: true
  native_cxx:
    command: g++
    required: true
  vivado:
    command: vivado
    required: false
  vitis:
    command: vitis
    required: false
  ssh:
    command: ssh
    required: false
  scp:
    command: scp
    required: false
  gtkwave:
    command: gtkwave
    required: false
