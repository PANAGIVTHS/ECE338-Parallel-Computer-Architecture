[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gpgpu-tasks"
version = "0.1.0"
description = "pydoit task definitions for the GPGPU project"
requires-python = ">=3.11"
dependencies = [
  "doit>=0.37,<1",
  # SystemVerilog compiler: elaborates (* host *) exports for the driver header.
  "pyslang>=12.1,<13",
  "rich>=13,<15",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
